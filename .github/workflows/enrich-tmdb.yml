name: Enrich TMDB posters

on:
  workflow_dispatch:
  push:
    branches:
      - feature/conflict-resolution-tmdb-posters
    paths:
      - 'scripts/enrich-tmdb-posters.mjs'
      - 'scripts/tmdb-overrides.json'
      - 'src/data/films.json'
      - '.github/workflows/enrich-tmdb.yml'

permissions:
  contents: write

concurrency:
  group: enrich-tmdb
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich TMDB posters
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.API_KEY }}
        run: npm run enrich:tmdb

      - name: Upload enrichment report
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-enrichment-report
          path: |
            scripts/tmdb-enrichment-report.md
            src/data/tmdb-posters.json

      - name: Commit generated poster metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tmdb-posters.json scripts/tmdb-enrichment-report.md
          if git diff --staged --quiet; then
            echo "No poster metadata changes"
            exit 0
          fi
          git commit -m "chore: refresh TMDB poster enrichment data"
          git push
